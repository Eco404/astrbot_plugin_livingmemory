<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860" role="img" aria-labelledby="title desc">
  <title id="title">Current recall and user-profile injection flow</title>
  <desc id="desc">The current message drives Topic-first recall while a stable private user resolves an exact Bot, persona, and actor profile. The two routes assemble independently and inject data-only context with the current message taking priority.</desc>
  <defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#17303a" flood-opacity="0.09"/></filter><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#84949e"/></marker><style>.title{font:700 34px Inter,"Noto Sans SC",sans-serif;fill:#17212b}.sub{font:400 17px Inter,"Noto Sans SC",sans-serif;fill:#64717d}.h{font:700 19px Inter,"Noto Sans SC",sans-serif;fill:#17212b}.p{font:400 14px Inter,"Noto Sans SC",sans-serif;fill:#586873}.tag{font:700 12px Inter,"Noto Sans SC",sans-serif;letter-spacing:.8px}.small{font:600 13px Inter,"Noto Sans SC",sans-serif}.line{stroke:#84949e;stroke-width:2;fill:none;marker-end:url(#arrow)}</style></defs>
  <rect width="1440" height="860" fill="#fff"/><text x="64" y="66" class="title">Long-term recall and current-user profiles load independently</text><text x="64" y="99" class="sub">Profiles do not pass through Topic search; an exact private peer may inject even when ordinary recall is empty or disabled.</text>

  <g filter="url(#shadow)"><rect x="64" y="154" width="274" height="222" rx="8" fill="#f7f9fa" stroke="#dce3e8"/><text x="88" y="190" class="tag" fill="#64717d">CURRENT REQUEST</text><text x="88" y="226" class="h">Request and identity</text><text x="88" y="263" class="p">Current user message · weight 1.00</text><text x="88" y="291" class="p">Bounded recent user/assistant support</text><text x="88" y="319" class="p">session · Bot · persona · actor</text><rect x="88" y="337" width="218" height="25" rx="6" fill="#eef1f3"/><text x="102" y="355" class="small" fill="#64717d">Current message controls the answer</text></g>

  <text x="394" y="137" class="tag" fill="#3769d6">LONG-TERM MEMORY ROUTE</text>
  <g filter="url(#shadow)"><rect x="394" y="154" width="280" height="222" rx="8" fill="#f5f7ff" stroke="#d4dcf4"/><text x="418" y="190" class="tag" fill="#3769d6">QUALIFY &amp; RANK</text><text x="418" y="226" class="h">Topic candidates and stop</text><text x="418" y="263" class="p">Embedding + keywords + optional Rerank</text><text x="418" y="291" class="p">Current relevance · MMR · relative floor</text><text x="418" y="319" class="p">Fall back to Timeline if Topic fails</text></g>
  <g filter="url(#shadow)"><rect x="730" y="154" width="280" height="222" rx="8" fill="#fff8f6" stroke="#efd8d2"/><text x="754" y="190" class="tag" fill="#c84f3d">ASSEMBLE MEMORY</text><text x="754" y="226" class="h">Build relevant memory context</text><text x="754" y="263" class="p">Topic body · new facts · time anchors</text><text x="754" y="291" class="p">Non-duplicate fragments and affect</text><text x="754" y="319" class="p">Context suppression and deduplication</text></g>
  <path d="M350 242H381" class="line"/><path d="M686 265H717" class="line"/>

  <text x="394" y="445" class="tag" fill="#2f7d50">CURRENT-USER PROFILE ROUTE</text>
  <g filter="url(#shadow)"><rect x="394" y="462" width="280" height="212" rx="8" fill="#f1faf6" stroke="#cce2d8"/><text x="418" y="498" class="tag" fill="#2f7d50">EXACT SCOPE</text><text x="418" y="534" class="h">Load exact current profile</text><text x="418" y="571" class="p">Stable private human actor only</text><text x="418" y="599" class="p">Bot + persona + logical-user scope</text><text x="418" y="627" class="p">No groups or arbitrary-user lookup</text></g>
  <g filter="url(#shadow)"><rect x="730" y="462" width="280" height="212" rx="8" fill="#f4fbfa" stroke="#c8e2df"/><text x="754" y="498" class="tag" fill="#187b78">BOUNDED PROFILE</text><text x="754" y="534" class="h">Select and compress profile</text><text x="754" y="571" class="p">Only active and current facts</text><text x="754" y="599" class="p">No pending, conflict, or stale facts</text><text x="754" y="627" class="p">Fact/relationship budget flows both ways</text></g>
  <path d="M338 319H366V568H381" class="line"/><path d="M686 568H717" class="line"/>

  <g filter="url(#shadow)"><rect x="1080" y="262" width="296" height="300" rx="8" fill="#fffaf3" stroke="#eadcc7"/><text x="1104" y="300" class="tag" fill="#a55f10">REQUEST INJECTION</text><text x="1104" y="338" class="h">Inject in separate markers</text><text x="1104" y="378" class="p">Relevant long-term memory</text><text x="1104" y="406" class="p">+ current-user data-only profile</text><text x="1104" y="434" class="p">+ current persona relationship</text><rect x="1104" y="468" width="248" height="54" rx="7" fill="#fff" stroke="#eadcc7"/><text x="1120" y="491" class="small" fill="#a55f10">Default profile cap: 800 chars</text><text x="1120" y="513" class="p">Current conversation wins conflicts</text></g>
  <path d="M1022 265H1055V354H1067" class="line"/><path d="M1022 568H1055V470H1067" class="line"/>

  <rect x="64" y="744" width="1312" height="74" rx="8" fill="#f7f8fa" stroke="#dce3e8"/><text x="88" y="776" class="tag" fill="#64717d">ACCESS &amp; TOOLS</text><text x="88" y="803" class="p">Only injected Topics record access. Active recall returns the current profile only with explicit include_user_profile=true and cannot query arbitrary users.</text>
</svg>
