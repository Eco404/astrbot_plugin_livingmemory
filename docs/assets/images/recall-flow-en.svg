<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="800" viewBox="0 0 1440 800" role="img" aria-labelledby="title desc">
  <title id="title">Topic-first recall flow</title><desc id="desc">The current message qualifies Topics, recent context adds bounded support, and filtered results assemble Topic, facts, fragments, and affect with Timeline fallback.</desc>
  <defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#17303a" flood-opacity="0.09"/></filter><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#84949e"/></marker><style>.title{font:700 34px Inter,"Noto Sans SC",sans-serif;fill:#17212b}.sub{font:400 17px Inter,"Noto Sans SC",sans-serif;fill:#64717d}.h{font:700 19px Inter,"Noto Sans SC",sans-serif;fill:#17212b}.p{font:400 14px Inter,"Noto Sans SC",sans-serif;fill:#586873}.tag{font:700 12px Inter,"Noto Sans SC",sans-serif;letter-spacing:.8px}.small{font:600 13px Inter,"Noto Sans SC",sans-serif}.line{stroke:#84949e;stroke-width:2;fill:none;marker-end:url(#arrow)}.dash{stroke:#a5b1b8;stroke-width:2;stroke-dasharray:6 7;fill:none;marker-end:url(#arrow)}</style></defs>
  <rect width="1440" height="800" fill="#fff"/><text x="64" y="66" class="title">Topic first, current message first</text><text x="64" y="99" class="sub">Context may support ranking but cannot replace current intent; final results may contain fewer than k.</text>
  <g filter="url(#shadow)">
    <rect x="64" y="154" width="280" height="246" rx="8" fill="#f7f9fa" stroke="#dce3e8"/><text x="88" y="188" class="tag" fill="#64717d">QUERY BRANCHES</text><text x="88" y="224" class="h">Query input</text>
    <rect x="88" y="247" width="232" height="50" rx="7" fill="#daf0ee"/><text x="106" y="278" class="small" fill="#187b78">Current user message · 1.00</text>
    <rect x="88" y="307" width="232" height="34" rx="7" fill="#fff" stroke="#dce3e8"/><text x="106" y="329" class="p">recent_user · optional weight</text>
    <rect x="88" y="351" width="232" height="34" rx="7" fill="#fff" stroke="#dce3e8"/><text x="106" y="373" class="p">recent_assistant · optional</text>
  </g>
  <g filter="url(#shadow)"><rect x="410" y="154" width="280" height="246" rx="8" fill="#f4fbfa" stroke="#c8e2df"/><text x="434" y="188" class="tag" fill="#187b78">CANDIDATES</text><text x="434" y="224" class="h">Topic candidate union</text><text x="434" y="261" class="p">Embedding + keywords</text><text x="434" y="289" class="p">Memory-space and state filters</text><text x="434" y="317" class="p">Optional actor bonus</text><rect x="434" y="342" width="232" height="29" rx="6" fill="#daf0ee"/><text x="449" y="362" class="small" fill="#187b78">Current message sets eligibility</text></g>
  <g filter="url(#shadow)"><rect x="756" y="154" width="280" height="246" rx="8" fill="#f5f7ff" stroke="#d4dcf4"/><text x="780" y="188" class="tag" fill="#3769d6">RANK &amp; FILTER</text><text x="780" y="224" class="h">Rank and stop</text><text x="780" y="261" class="p">Current relevance + bounded context</text><text x="780" y="289" class="p">optional Rerank rank bonus</text><text x="780" y="317" class="p">Relative floor · MMR · dynamic stop</text><rect x="780" y="342" width="170" height="29" rx="6" fill="#e5eaff"/><text x="796" y="362" class="small" fill="#3769d6">No forced fill to k</text></g>
  <g filter="url(#shadow)"><rect x="1102" y="154" width="274" height="246" rx="8" fill="#fff8f6" stroke="#efd8d2"/><text x="1126" y="188" class="tag" fill="#c84f3d">ASSEMBLE</text><text x="1126" y="224" class="h">Assemble injection</text><text x="1126" y="261" class="p">Topic body</text><text x="1126" y="289" class="p">New facts and time anchors</text><text x="1126" y="317" class="p">Non-duplicate fragments and affect</text><rect x="1126" y="342" width="226" height="29" rx="6" fill="#fae5e0"/><text x="1141" y="362" class="small" fill="#c84f3d">Record access after injection</text></g>
  <path d="M356 277H397" class="line"/><path d="M702 277H743" class="line"/><path d="M1048 277H1089" class="line"/>

  <rect x="64" y="480" width="1312" height="232" rx="8" fill="#f7f8fa" stroke="#dce3e8"/>
  <text x="88" y="521" class="tag" fill="#64717d">GUARDRAILS &amp; FALLBACK</text>
  <g>
    <rect x="88" y="553" width="280" height="116" rx="8" fill="#fff" stroke="#dce3e8"/><text x="110" y="588" class="h">Context deduplication</text><text x="110" y="619" class="p">Suppress sources still visible in context</text><text x="110" y="645" class="p">Merge duplicate paragraphs and facts</text>
    <rect x="400" y="553" width="280" height="116" rx="8" fill="#fff" stroke="#dce3e8"/><text x="422" y="588" class="h">Fragment trimming</text><text x="422" y="619" class="p">Keep new facts when body is duplicate</text><text x="422" y="645" class="p">Affect and concrete details stay eligible</text>
    <rect x="712" y="553" width="280" height="116" rx="8" fill="#fff" stroke="#dce3e8"/><text x="734" y="588" class="h">Timeline access linkage</text><text x="734" y="619" class="p">Forward bounded access after injection</text><text x="734" y="645" class="p">Reuse Timeline decay and access</text>
    <rect x="1024" y="553" width="328" height="116" rx="8" fill="#fff" stroke="#dce3e8"/><text x="1046" y="588" class="h">Safe fallback</text><text x="1046" y="619" class="p">Topic unavailable or retrieval failed</text><text x="1046" y="645" class="p">Fall back to structured Timeline recall</text>
  </g>
  <path d="M1239 412V466" class="dash"/>
</svg>
