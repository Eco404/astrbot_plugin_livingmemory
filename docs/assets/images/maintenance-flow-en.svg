<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="880" viewBox="0 0 1440 880" role="img" aria-labelledby="title desc">
  <title id="title">Current LivingMemory maintenance architecture</title>
  <desc id="desc">The maintenance center covers Topic, Timeline, user profiles, sessions, database, and diagnostics. Manual work follows scope, preview, confirmation, durable job, and publication. A periodic profile lifecycle advances due states and compacts rebuildable data.</desc>
  <defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#17303a" flood-opacity="0.09"/></filter><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#8797a1"/></marker><style>.title{font:700 34px Inter,"Noto Sans SC",sans-serif;fill:#17212b}.sub{font:400 17px Inter,"Noto Sans SC",sans-serif;fill:#64717d}.h{font:700 18px Inter,"Noto Sans SC",sans-serif;fill:#17212b}.p{font:400 14px Inter,"Noto Sans SC",sans-serif;fill:#586873}.tag{font:700 12px Inter,"Noto Sans SC",sans-serif;letter-spacing:.8px}.route{stroke:#8797a1;stroke-width:2;fill:none}.line{stroke:#8797a1;stroke-width:2;fill:none;marker-end:url(#arrow)}</style></defs>
  <rect width="1440" height="880" fill="#fff"/><text x="64" y="66" class="title">Maintenance UI and background lifecycle govern derived data</text><text x="64" y="99" class="sub">Manual work previews an exact scope; periodic work only advances due state and removes rebuildable data.</text>
  <text x="64" y="142" class="tag" fill="#64717d">MAINTENANCE AREAS</text>
  <g>
    <rect x="64" y="166" width="202" height="114" rx="8" fill="#f4fbfa" stroke="#c8e2df"/><text x="84" y="199" class="h">Topic</text><text x="84" y="229" class="p">build · review · merge · split</text><text x="84" y="253" class="p">vectors · relations · archive</text>
    <rect x="286" y="166" width="202" height="114" rx="8" fill="#f5f7ff" stroke="#d4dcf4"/><text x="306" y="199" class="h">Timeline</text><text x="306" y="229" class="p">quality · in-place rebuild</text><text x="306" y="253" class="p">staged edits · state</text>
    <rect x="508" y="166" width="202" height="114" rx="8" fill="#f1faf6" stroke="#cce2d8"/><text x="528" y="199" class="h">User profiles</text><text x="528" y="229" class="p">facts · conflicts · identity</text><text x="528" y="253" class="p">relationship · history rebuild</text>
    <rect x="730" y="166" width="202" height="114" rx="8" fill="#fffaf3" stroke="#eadcc7"/><text x="750" y="199" class="h">Session audit</text><text x="750" y="229" class="p">chat cleanup · aliases</text><text x="750" y="253" class="p">durable cross-DB jobs</text>
    <rect x="952" y="166" width="202" height="114" rx="8" fill="#fff8f6" stroke="#efd8d2"/><text x="972" y="199" class="h">Database</text><text x="972" y="229" class="p">health · selected repair</text><text x="972" y="253" class="p">artifacts · VACUUM</text>
    <rect x="1174" y="166" width="202" height="114" rx="8" fill="#f7f8fa" stroke="#dce3e8"/><text x="1194" y="199" class="h">Diagnostics</text><text x="1194" y="229" class="p">recent recall · recall test</text><text x="1194" y="253" class="p">model test · JSON</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="64" y="342" width="250" height="150" rx="8" fill="#f7f9fa" stroke="#dce3e8"/><text x="88" y="377" class="tag" fill="#64717d">1 · SCOPE</text><text x="88" y="414" class="h">Resolve exact target</text><text x="88" y="446" class="p">Memory space or profile scope</text><text x="88" y="470" class="p">Load revision, counts, and state</text>
    <rect x="376" y="342" width="250" height="150" rx="8" fill="#f4fbfa" stroke="#c8e2df"/><text x="400" y="377" class="tag" fill="#187b78">2 · PREVIEW</text><text x="400" y="414" class="h">Inspect impact and fingerprint</text><text x="400" y="446" class="p">Sources, conflicts, identity, gaps</text><text x="400" y="470" class="p">Conservative defaults</text>
    <rect x="688" y="342" width="250" height="150" rx="8" fill="#fffaf3" stroke="#eadcc7"/><text x="712" y="377" class="tag" fill="#b56d17">3 · CONFIRM</text><text x="712" y="414" class="h">Confirm governance action</text><text x="712" y="446" class="p">Second step for dangerous work</text><text x="712" y="470" class="p">Reject stale fingerprints</text>
    <rect x="1000" y="342" width="376" height="150" rx="8" fill="#f5f7ff" stroke="#d4dcf4"/><text x="1024" y="377" class="tag" fill="#3769d6">4 · DURABLE JOB</text><text x="1024" y="414" class="h">Run in order and checkpoint</text><text x="1024" y="446" class="p">Stage · processed/total · recoverable error</text><text x="1024" y="470" class="p">Fact and relationship stages retain published results</text>
  </g>
  <path d="M326 417H363" class="line"/><path d="M638 417H675" class="line"/><path d="M950 417H987" class="line"/>

  <g filter="url(#shadow)">
    <rect x="64" y="566" width="624" height="108" rx="8" fill="#f1faf6" stroke="#cce2d8"/><circle cx="100" cy="605" r="11" fill="#2f8f63"/><text x="126" y="612" class="h">Complete and publish</text><text x="100" y="645" class="p">Refresh formal revision, injection preview, and counts; retain provenance and audit</text>
    <rect x="752" y="566" width="624" height="108" rx="8" fill="#fff8f6" stroke="#efd8d2"/><circle cx="788" cy="605" r="11" fill="#c84f3d"/><text x="814" y="612" class="h">Fail or cancel</text><text x="788" y="645" class="p">Keep old formal data available; retain checkpoints, error, and retry path</text>
  </g>
  <path d="M1188 492V530H720" class="route"/><path d="M720 530H376V553" class="line"/><path d="M720 530H1064V553" class="line"/>

  <rect x="64" y="738" width="1312" height="94" rx="8" fill="#f7f8fa" stroke="#dce3e8"/>
  <text x="88" y="772" class="tag" fill="#64717d">PERIODIC PROFILE LIFECYCLE</text>
  <text x="88" y="804" class="h">active → stale · pending/stale → archived</text><text x="510" y="804" class="p">Expire completed jobs and old projections superseded by completed revisions</text><text x="1080" y="804" class="small">Keep current and referenced sources</text>
</svg>
