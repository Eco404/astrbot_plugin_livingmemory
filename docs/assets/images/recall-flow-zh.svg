<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="800" viewBox="0 0 1440 800" role="img" aria-labelledby="title desc">
  <title id="title">Topic 优先召回流程</title><desc id="desc">当前消息决定候选资格，最近上下文提供有限支持，经 Topic 检索、过滤和可选 Rerank 后，组合 Topic、事实、片段与情绪，失败时回退 Timeline。</desc>
  <defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#17303a" flood-opacity="0.09"/></filter><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#84949e"/></marker><style>.title{font:700 34px Inter,"Noto Sans SC",sans-serif;fill:#17212b}.sub{font:400 17px Inter,"Noto Sans SC",sans-serif;fill:#64717d}.h{font:700 19px Inter,"Noto Sans SC",sans-serif;fill:#17212b}.p{font:400 14px Inter,"Noto Sans SC",sans-serif;fill:#586873}.tag{font:700 12px Inter,"Noto Sans SC",sans-serif;letter-spacing:.8px}.small{font:600 13px Inter,"Noto Sans SC",sans-serif}.line{stroke:#84949e;stroke-width:2;fill:none;marker-end:url(#arrow)}.dash{stroke:#a5b1b8;stroke-width:2;stroke-dasharray:6 7;fill:none;marker-end:url(#arrow)}</style></defs>
  <rect width="1440" height="800" fill="#fff"/><text x="64" y="66" class="title">Topic 优先，当前消息优先</text><text x="64" y="99" class="sub">上下文只能辅助排序，不能替代当前用户意图；最终结果允许少于 k。</text>
  <g filter="url(#shadow)">
    <rect x="64" y="154" width="280" height="246" rx="8" fill="#f7f9fa" stroke="#dce3e8"/><text x="88" y="188" class="tag" fill="#64717d">QUERY BRANCHES</text><text x="88" y="224" class="h">查询输入</text>
    <rect x="88" y="247" width="232" height="50" rx="7" fill="#daf0ee"/><text x="106" y="278" class="small" fill="#187b78">当前用户消息 · 1.00</text>
    <rect x="88" y="307" width="232" height="34" rx="7" fill="#fff" stroke="#dce3e8"/><text x="106" y="329" class="p">recent_user · 可配置</text>
    <rect x="88" y="351" width="232" height="34" rx="7" fill="#fff" stroke="#dce3e8"/><text x="106" y="373" class="p">recent_assistant · 可选</text>
  </g>
  <g filter="url(#shadow)"><rect x="410" y="154" width="280" height="246" rx="8" fill="#f4fbfa" stroke="#c8e2df"/><text x="434" y="188" class="tag" fill="#187b78">CANDIDATES</text><text x="434" y="224" class="h">Topic 候选并集</text><text x="434" y="261" class="p">Embedding + 关键词</text><text x="434" y="289" class="p">记忆空间与状态过滤</text><text x="434" y="317" class="p">可选参与者轻量加分</text><rect x="434" y="342" width="189" height="29" rx="6" fill="#daf0ee"/><text x="449" y="362" class="small" fill="#187b78">当前消息独立决定资格</text></g>
  <g filter="url(#shadow)"><rect x="756" y="154" width="280" height="246" rx="8" fill="#f5f7ff" stroke="#d4dcf4"/><text x="780" y="188" class="tag" fill="#3769d6">RANK &amp; FILTER</text><text x="780" y="224" class="h">排序与停止</text><text x="780" y="261" class="p">当前相关度 + 有界上下文奖励</text><text x="780" y="289" class="p">可选 Rerank 相对名次</text><text x="780" y="317" class="p">相对门槛 · MMR · 动态停止</text><rect x="780" y="342" width="170" height="29" rx="6" fill="#e5eaff"/><text x="796" y="362" class="small" fill="#3769d6">不要求强行填满 k</text></g>
  <g filter="url(#shadow)"><rect x="1102" y="154" width="274" height="246" rx="8" fill="#fff8f6" stroke="#efd8d2"/><text x="1126" y="188" class="tag" fill="#c84f3d">ASSEMBLE</text><text x="1126" y="224" class="h">组合注入内容</text><text x="1126" y="261" class="p">Topic 主体</text><text x="1126" y="289" class="p">新增事实与时间锚点</text><text x="1126" y="317" class="p">非重复片段与情绪</text><rect x="1126" y="342" width="177" height="29" rx="6" fill="#fae5e0"/><text x="1141" y="362" class="small" fill="#c84f3d">注入后才记录访问</text></g>
  <path d="M356 277H397" class="line"/><path d="M702 277H743" class="line"/><path d="M1048 277H1089" class="line"/>

  <rect x="64" y="480" width="1312" height="232" rx="8" fill="#f7f8fa" stroke="#dce3e8"/>
  <text x="88" y="521" class="tag" fill="#64717d">GUARDRAILS &amp; FALLBACK</text>
  <g>
    <rect x="88" y="553" width="280" height="116" rx="8" fill="#fff" stroke="#dce3e8"/><text x="110" y="588" class="h">上下文去重</text><text x="110" y="619" class="p">来源仍在当前窗口时抑制重复注入</text><text x="110" y="645" class="p">跨 Topic 合并重复段落与事实</text>
    <rect x="400" y="553" width="280" height="116" rx="8" fill="#fff" stroke="#dce3e8"/><text x="422" y="588" class="h">片段精简</text><text x="422" y="619" class="p">正文重复时只保留新增事实</text><text x="422" y="645" class="p">情绪与具体情节仍可补充</text>
    <rect x="712" y="553" width="280" height="116" rx="8" fill="#fff" stroke="#dce3e8"/><text x="734" y="588" class="h">Timeline 联动</text><text x="734" y="619" class="p">实际注入后传递有界访问贡献</text><text x="734" y="645" class="p">复用原有衰减与强化机制</text>
    <rect x="1024" y="553" width="328" height="116" rx="8" fill="#fff" stroke="#dce3e8"/><text x="1046" y="588" class="h">安全回退</text><text x="1046" y="619" class="p">Topic 不可用或检索失败</text><text x="1046" y="645" class="p">回退结构化 Timeline 召回</text>
  </g>
  <path d="M1239 412V466" class="dash"/>
</svg>
