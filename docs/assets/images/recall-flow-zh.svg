<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860" role="img" aria-labelledby="title desc">
  <title id="title">当前召回与用户画像注入流程</title>
  <desc id="desc">当前消息驱动 Topic 优先召回；私聊稳定用户同时按 Bot、persona 和 actor 精确加载画像。两路在各自规则和预算内组装，并以 data-only 内容注入，当前消息始终优先。</desc>
  <defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#17303a" flood-opacity="0.09"/></filter><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#84949e"/></marker><style>.title{font:700 34px Inter,"Noto Sans SC",sans-serif;fill:#17212b}.sub{font:400 17px Inter,"Noto Sans SC",sans-serif;fill:#64717d}.h{font:700 19px Inter,"Noto Sans SC",sans-serif;fill:#17212b}.p{font:400 14px Inter,"Noto Sans SC",sans-serif;fill:#586873}.tag{font:700 12px Inter,"Noto Sans SC",sans-serif;letter-spacing:.8px}.small{font:600 13px Inter,"Noto Sans SC",sans-serif}.line{stroke:#84949e;stroke-width:2;fill:none;marker-end:url(#arrow)}.dash{stroke:#a5b1b8;stroke-width:2;stroke-dasharray:6 7;fill:none;marker-end:url(#arrow)}</style></defs>
  <rect width="1440" height="860" fill="#fff"/><text x="64" y="66" class="title">长期记忆召回与当前用户画像独立加载</text><text x="64" y="99" class="sub">画像不经过 Topic 检索；即使普通召回关闭或无结果，稳定私聊对象仍可获得画像注入。</text>

  <g filter="url(#shadow)"><rect x="64" y="154" width="274" height="222" rx="8" fill="#f7f9fa" stroke="#dce3e8"/><text x="88" y="190" class="tag" fill="#64717d">CURRENT REQUEST</text><text x="88" y="226" class="h">请求与身份</text><text x="88" y="263" class="p">当前用户消息 · 权重 1.00</text><text x="88" y="291" class="p">recent_user / assistant 有界辅助</text><text x="88" y="319" class="p">session · Bot · persona · actor</text><rect x="88" y="337" width="194" height="25" rx="6" fill="#eef1f3"/><text x="102" y="355" class="small" fill="#64717d">当前消息始终决定回答</text></g>

  <text x="394" y="137" class="tag" fill="#3769d6">LONG-TERM MEMORY ROUTE</text>
  <g filter="url(#shadow)"><rect x="394" y="154" width="280" height="222" rx="8" fill="#f5f7ff" stroke="#d4dcf4"/><text x="418" y="190" class="tag" fill="#3769d6">QUALIFY &amp; RANK</text><text x="418" y="226" class="h">Topic 候选、排序与停止</text><text x="418" y="263" class="p">Embedding + 关键词 + 可选 Rerank</text><text x="418" y="291" class="p">当前相关度 · MMR · 相对门槛</text><text x="418" y="319" class="p">Topic 不可用时回退 Timeline</text></g>
  <g filter="url(#shadow)"><rect x="730" y="154" width="280" height="222" rx="8" fill="#fff8f6" stroke="#efd8d2"/><text x="754" y="190" class="tag" fill="#c84f3d">ASSEMBLE MEMORY</text><text x="754" y="226" class="h">组合相关长期记忆</text><text x="754" y="263" class="p">Topic 主体 · 新事实 · 时间锚点</text><text x="754" y="291" class="p">非重复正式片段与情绪</text><text x="754" y="319" class="p">上下文覆盖抑制与去重</text></g>
  <path d="M350 242H381" class="line"/><path d="M686 265H717" class="line"/>

  <text x="394" y="445" class="tag" fill="#2f7d50">CURRENT-USER PROFILE ROUTE</text>
  <g filter="url(#shadow)"><rect x="394" y="462" width="280" height="212" rx="8" fill="#f1faf6" stroke="#cce2d8"/><text x="418" y="498" class="tag" fill="#2f7d50">EXACT SCOPE</text><text x="418" y="534" class="h">精确加载当前画像</text><text x="418" y="571" class="p">仅稳定私聊 actor</text><text x="418" y="599" class="p">Bot + persona + 逻辑用户作用域</text><text x="418" y="627" class="p">群聊和任意用户查询均拒绝</text></g>
  <g filter="url(#shadow)"><rect x="730" y="462" width="280" height="212" rx="8" fill="#f4fbfa" stroke="#c8e2df"/><text x="754" y="498" class="tag" fill="#187b78">BOUNDED PROFILE</text><text x="754" y="534" class="h">选择并压缩画像</text><text x="754" y="571" class="p">仅 active 且当前有效事实</text><text x="754" y="599" class="p">pending/conflict/stale 不注入</text><text x="754" y="627" class="p">关系与事实预算双向回流</text></g>
  <path d="M338 319H366V568H381" class="line"/><path d="M686 568H717" class="line"/>

  <g filter="url(#shadow)"><rect x="1080" y="262" width="296" height="300" rx="8" fill="#fffaf3" stroke="#eadcc7"/><text x="1104" y="300" class="tag" fill="#a55f10">REQUEST INJECTION</text><text x="1104" y="338" class="h">分隔标记下共同注入</text><text x="1104" y="378" class="p">相关长期记忆</text><text x="1104" y="406" class="p">+ 当前用户 data-only 画像</text><text x="1104" y="434" class="p">+ 当前 persona 关系状态</text><rect x="1104" y="468" width="248" height="54" rx="7" fill="#fff" stroke="#eadcc7"/><text x="1120" y="491" class="small" fill="#a55f10">画像默认总上限 800 字符</text><text x="1120" y="513" class="p">当前对话冲突时以当前消息为准</text></g>
  <path d="M1022 265H1055V354H1067" class="line"/><path d="M1022 568H1055V470H1067" class="line"/>

  <rect x="64" y="744" width="1312" height="74" rx="8" fill="#f7f8fa" stroke="#dce3e8"/><text x="88" y="776" class="tag" fill="#64717d">ACCESS &amp; TOOLS</text><text x="88" y="803" class="p">只有实际注入的 Topic 才记录访问贡献；主动召回必须显式 include_user_profile=true 才返回当前用户画像，不能查询任意用户。</text>
</svg>
