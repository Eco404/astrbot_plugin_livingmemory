<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="800" viewBox="0 0 1440 800" role="img" aria-labelledby="title desc">
  <title id="title">LivingMemory 维护中心</title><desc id="desc">用户选择记忆空间后，从检查预览、确认、后台任务到完成或失败清理，并管理 Topic、Timeline、会话、数据库和诊断。</desc>
  <defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#17303a" flood-opacity="0.09"/></filter><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#8797a1"/></marker><style>.title{font:700 34px Inter,"Noto Sans SC",sans-serif;fill:#17212b}.sub{font:400 17px Inter,"Noto Sans SC",sans-serif;fill:#64717d}.h{font:700 18px Inter,"Noto Sans SC",sans-serif;fill:#17212b}.p{font:400 14px Inter,"Noto Sans SC",sans-serif;fill:#586873}.tag{font:700 12px Inter,"Noto Sans SC",sans-serif;letter-spacing:.8px}.route{stroke:#8797a1;stroke-width:2;fill:none}.line{stroke:#8797a1;stroke-width:2;fill:none;marker-end:url(#arrow)}</style></defs>
  <rect width="1440" height="800" fill="#fff"/><text x="64" y="66" class="title">维护操作共享同一套安全交互</text><text x="64" y="99" class="sub">没有选择记忆空间时禁用操作；长任务必须显示阶段、数量、状态与可恢复结果。</text>
  <text x="64" y="142" class="tag" fill="#64717d">MAINTENANCE AREAS</text>
  <g>
    <rect x="64" y="166" width="244" height="104" rx="8" fill="#f4fbfa" stroke="#c8e2df"/><text x="86" y="200" class="h">Topic 记忆维护</text><text x="86" y="231" class="p">补建 · 审查 · 合并拆分</text><text x="86" y="255" class="p">向量 · 关系 · 归档 · 清空</text>
    <rect x="331" y="166" width="244" height="104" rx="8" fill="#f5f7ff" stroke="#d4dcf4"/><text x="353" y="200" class="h">Timeline 记忆维护</text><text x="353" y="231" class="p">质量检测 · 同 ID 重构</text><text x="353" y="255" class="p">暂存应用 · 不活跃管理</text>
    <rect x="598" y="166" width="244" height="104" rx="8" fill="#fffaf3" stroke="#eadcc7"/><text x="620" y="200" class="h">会话审计</text><text x="620" y="231" class="p">聊天记录清理 · 别名合并</text><text x="620" y="255" class="p">跨数据库持久化任务</text>
    <rect x="865" y="166" width="244" height="104" rx="8" fill="#fff8f6" stroke="#efd8d2"/><text x="887" y="200" class="h">数据库</text><text x="887" y="231" class="p">健康检查 · 选择性修复</text><text x="887" y="255" class="p">中间数据清理 · 压缩</text>
    <rect x="1132" y="166" width="244" height="104" rx="8" fill="#f7f8fa" stroke="#dce3e8"/><text x="1154" y="200" class="h">诊断与测试</text><text x="1154" y="231" class="p">最近召回 · 召回测试</text><text x="1154" y="255" class="p">模型测试 · JSON 导出</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="64" y="322" width="250" height="154" rx="8" fill="#f7f9fa" stroke="#dce3e8"/><text x="88" y="357" class="tag" fill="#64717d">1 · SCOPE</text><text x="88" y="394" class="h">选择记忆空间</text><text x="88" y="426" class="p">未选择：说明灰显、按钮禁用</text><text x="88" y="452" class="p">选择后：加载数量与当前状态</text>
    <rect x="376" y="322" width="250" height="154" rx="8" fill="#f4fbfa" stroke="#c8e2df"/><text x="400" y="357" class="tag" fill="#187b78">2 · PREVIEW</text><text x="400" y="394" class="h">检查与预览</text><text x="400" y="426" class="p">列出目标、影响范围和风险</text><text x="400" y="452" class="p">默认采用保守选择</text>
    <rect x="688" y="322" width="250" height="154" rx="8" fill="#fffaf3" stroke="#eadcc7"/><text x="712" y="357" class="tag" fill="#b56d17">3 · CONFIRM</text><text x="712" y="394" class="h">用户确认</text><text x="712" y="426" class="p">危险操作二次确认</text><text x="712" y="452" class="p">可调整选中项或取消</text>
    <rect x="1000" y="322" width="376" height="154" rx="8" fill="#f5f7ff" stroke="#d4dcf4"/><text x="1024" y="357" class="tag" fill="#3769d6">4 · BACKGROUND JOB</text><text x="1024" y="394" class="h">执行并显示实时进度</text><text x="1024" y="426" class="p">当前阶段 · 已处理 / 总量 · 耗时</text><text x="1024" y="452" class="p">刷新、关闭页面或重启后可恢复查询</text>
  </g>
  <path d="M326 399H363" class="line"/><path d="M638 399H675" class="line"/><path d="M950 399H987" class="line"/>

  <g filter="url(#shadow)">
    <rect x="64" y="566" width="624" height="112" rx="8" fill="#f1faf6" stroke="#cce2d8"/><circle cx="100" cy="605" r="11" fill="#2f8f63"/><text x="126" y="612" class="h">完成</text><text x="100" y="647" class="p">刷新正式数据与计数；已完成中间数据可自动或手动清理</text>
    <rect x="752" y="566" width="624" height="112" rx="8" fill="#fff8f6" stroke="#efd8d2"/><circle cx="788" cy="605" r="11" fill="#c84f3d"/><text x="814" y="612" class="h">失败或取消</text><text x="788" y="647" class="p">保留可读错误与断点；正式数据不变，用户可重试或清除任务</text>
  </g>
  <path d="M1188 476V522H720" class="route"/><path d="M720 522H376V553" class="line"/><path d="M720 522H1064V553" class="line"/>
</svg>
