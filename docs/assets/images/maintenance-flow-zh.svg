<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="880" viewBox="0 0 1440 880" role="img" aria-labelledby="title desc">
  <title id="title">LivingMemory 当前维护架构</title>
  <desc id="desc">维护中心包含 Topic、Timeline、用户画像、会话、数据库和诊断区域。人工操作遵循作用域、预览、确认、持久任务和结果发布流程；画像生命周期另有周期任务推进状态和压缩可重建数据。</desc>
  <defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#17303a" flood-opacity="0.09"/></filter><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#8797a1"/></marker><style>.title{font:700 34px Inter,"Noto Sans SC",sans-serif;fill:#17212b}.sub{font:400 17px Inter,"Noto Sans SC",sans-serif;fill:#64717d}.h{font:700 18px Inter,"Noto Sans SC",sans-serif;fill:#17212b}.p{font:400 14px Inter,"Noto Sans SC",sans-serif;fill:#586873}.tag{font:700 12px Inter,"Noto Sans SC",sans-serif;letter-spacing:.8px}.route{stroke:#8797a1;stroke-width:2;fill:none}.line{stroke:#8797a1;stroke-width:2;fill:none;marker-end:url(#arrow)}</style></defs>
  <rect width="1440" height="880" fill="#fff"/><text x="64" y="66" class="title">维护页面与后台生命周期共同治理派生数据</text><text x="64" y="99" class="sub">人工操作先确定作用域并预览；周期任务只推进到期状态和清理可重建数据。</text>
  <text x="64" y="142" class="tag" fill="#64717d">MAINTENANCE AREAS</text>
  <g>
    <rect x="64" y="166" width="202" height="114" rx="8" fill="#f4fbfa" stroke="#c8e2df"/><text x="84" y="199" class="h">Topic</text><text x="84" y="229" class="p">补建 · 审查 · 合并拆分</text><text x="84" y="253" class="p">向量 · 关系 · 归档</text>
    <rect x="286" y="166" width="202" height="114" rx="8" fill="#f5f7ff" stroke="#d4dcf4"/><text x="306" y="199" class="h">Timeline</text><text x="306" y="229" class="p">质量检测 · 同 ID 重构</text><text x="306" y="253" class="p">暂存编辑 · 状态管理</text>
    <rect x="508" y="166" width="202" height="114" rx="8" fill="#f1faf6" stroke="#cce2d8"/><text x="528" y="199" class="h">用户画像</text><text x="528" y="229" class="p">事实 · 冲突 · 身份审查</text><text x="528" y="253" class="p">关系 revision · 历史重建</text>
    <rect x="730" y="166" width="202" height="114" rx="8" fill="#fffaf3" stroke="#eadcc7"/><text x="750" y="199" class="h">会话审计</text><text x="750" y="229" class="p">聊天清理 · 别名合并</text><text x="750" y="253" class="p">跨数据库持久任务</text>
    <rect x="952" y="166" width="202" height="114" rx="8" fill="#fff8f6" stroke="#efd8d2"/><text x="972" y="199" class="h">数据库</text><text x="972" y="229" class="p">健康检查 · 选择修复</text><text x="972" y="253" class="p">中间数据 · VACUUM</text>
    <rect x="1174" y="166" width="202" height="114" rx="8" fill="#f7f8fa" stroke="#dce3e8"/><text x="1194" y="199" class="h">诊断与测试</text><text x="1194" y="229" class="p">最近召回 · 召回测试</text><text x="1194" y="253" class="p">模型测试 · JSON</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="64" y="342" width="250" height="150" rx="8" fill="#f7f9fa" stroke="#dce3e8"/><text x="88" y="377" class="tag" fill="#64717d">1 · SCOPE</text><text x="88" y="414" class="h">确定目标作用域</text><text x="88" y="446" class="p">记忆空间或精确画像 scope</text><text x="88" y="470" class="p">加载 revision、数量与状态</text>
    <rect x="376" y="342" width="250" height="150" rx="8" fill="#f4fbfa" stroke="#c8e2df"/><text x="400" y="377" class="tag" fill="#187b78">2 · PREVIEW</text><text x="400" y="414" class="h">检查影响与指纹</text><text x="400" y="446" class="p">来源、冲突、身份歧义、缺口</text><text x="400" y="470" class="p">默认采用保守选择</text>
    <rect x="688" y="342" width="250" height="150" rx="8" fill="#fffaf3" stroke="#eadcc7"/><text x="712" y="377" class="tag" fill="#b56d17">3 · CONFIRM</text><text x="712" y="414" class="h">确认治理动作</text><text x="712" y="446" class="p">危险操作二次确认</text><text x="712" y="470" class="p">过期指纹拒绝提交</text>
    <rect x="1000" y="342" width="376" height="150" rx="8" fill="#f5f7ff" stroke="#d4dcf4"/><text x="1024" y="377" class="tag" fill="#3769d6">4 · DURABLE JOB</text><text x="1024" y="414" class="h">有序执行并保存检查点</text><text x="1024" y="446" class="p">当前阶段 · 已处理/总量 · 可恢复错误</text><text x="1024" y="470" class="p">事实与关系阶段失败互不回滚已发布结果</text>
  </g>
  <path d="M326 417H363" class="line"/><path d="M638 417H675" class="line"/><path d="M950 417H987" class="line"/>

  <g filter="url(#shadow)">
    <rect x="64" y="566" width="624" height="108" rx="8" fill="#f1faf6" stroke="#cce2d8"/><circle cx="100" cy="605" r="11" fill="#2f8f63"/><text x="126" y="612" class="h">完成并发布</text><text x="100" y="645" class="p">刷新正式 revision、注入预览和计数；保留来源与必要审计</text>
    <rect x="752" y="566" width="624" height="108" rx="8" fill="#fff8f6" stroke="#efd8d2"/><circle cx="788" cy="605" r="11" fill="#c84f3d"/><text x="814" y="612" class="h">失败或取消</text><text x="788" y="645" class="p">旧正式数据继续可用；保存断点、错误与重试入口</text>
  </g>
  <path d="M1188 492V530H720" class="route"/><path d="M720 530H376V553" class="line"/><path d="M720 530H1064V553" class="line"/>

  <rect x="64" y="738" width="1312" height="94" rx="8" fill="#f7f8fa" stroke="#dce3e8"/>
  <text x="88" y="772" class="tag" fill="#64717d">PERIODIC PROFILE LIFECYCLE</text>
  <text x="88" y="804" class="h">active → stale · pending/stale → archived</text><text x="510" y="804" class="p">清理过期完成任务与已被 completed revision 取代的旧投影</text><text x="1040" y="804" class="small">当前投影和仍被事实引用的来源保留</text>
</svg>
