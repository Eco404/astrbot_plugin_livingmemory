<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="850" viewBox="0 0 1440 850" role="img" aria-labelledby="title desc">
  <title id="title">LivingMemory 当前分层架构</title>
  <desc id="desc">原始会话生成可编辑 Timeline；Timeline 分别派生 Topic 和用户画像。人格关系执行时读取当前 persona，数据库不保存 persona 正文。Topic 召回与当前用户画像从不同通道进入右侧的私聊请求，并在独立预算内共同注入。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#17303a" flood-opacity="0.09"/></filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#82939d"/></marker>
    <style>
      .title{font:700 34px Inter,"Noto Sans SC",sans-serif;fill:#17212b}.sub{font:400 17px Inter,"Noto Sans SC",sans-serif;fill:#64717d}
      .h{font:700 19px Inter,"Noto Sans SC",sans-serif;fill:#17212b}.p{font:400 14px Inter,"Noto Sans SC",sans-serif;fill:#52616c}
      .tag{font:700 12px Inter,"Noto Sans SC",sans-serif;letter-spacing:1px}.small{font:500 13px Inter,"Noto Sans SC",sans-serif;fill:#64717d}
      .line{stroke:#82939d;stroke-width:2;fill:none;marker-end:url(#arrow)}.dash{stroke:#9aa8b0;stroke-width:2;stroke-dasharray:6 7;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1440" height="850" fill="#fff"/>
  <text x="40" y="66" class="title">一份 Timeline，两条可追溯派生路径</text>
  <text x="40" y="99" class="sub">Topic 组织跨时间记忆；用户画像理解当前私聊对象。两者都不反向改写来源。</text>

  <g filter="url(#shadow)">
    <rect x="40" y="166" width="220" height="202" rx="8" fill="#fffaf3" stroke="#eadcc7"/>
    <rect x="40" y="166" width="220" height="7" rx="3" fill="#c9791c"/>
    <text x="64" y="207" class="tag" fill="#a55f10">SOURCE</text><text x="64" y="241" class="h">原始会话</text>
    <text x="64" y="276" class="p">消息 · 发送者 · 角色 · 时间</text><text x="64" y="304" class="p">总结游标与来源范围</text>
    <rect x="64" y="326" width="137" height="25" rx="6" fill="#fff1df"/><text x="78" y="344" class="small" fill="#a55f10">conversations.db</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="300" y="166" width="270" height="202" rx="8" fill="#f4fbfa" stroke="#c8e2df"/>
    <rect x="300" y="166" width="270" height="7" rx="3" fill="#187b78"/>
    <text x="324" y="207" class="tag" fill="#187b78">TIMELINE</text><text x="324" y="241" class="h">可编辑时间来源层</text>
    <text x="324" y="276" class="p">摘要 · 关键事实 · 情绪 · 人物绑定</text><text x="324" y="304" class="p">稳定 memory_uid + revision</text>
    <rect x="324" y="326" width="101" height="25" rx="6" fill="#daf0ee"/><text x="340" y="344" class="small" fill="#187b78">用户可编辑</text>
  </g>
  <path d="M272 267H287" class="line"/>

  <text x="620" y="139" class="tag" fill="#3769d6">TOPIC DERIVATION</text>
  <g filter="url(#shadow)">
    <rect x="620" y="166" width="230" height="202" rx="8" fill="#f5f7ff" stroke="#d4dcf4"/>
    <text x="644" y="207" class="tag" fill="#3769d6">FORMAL FRAGMENT</text><text x="644" y="241" class="h">正式片段</text>
    <text x="644" y="276" class="p">单一未来检索意图</text><text x="644" y="304" class="p">事实来源与稳定逻辑 ID</text>
    <text x="644" y="332" class="p">按 Timeline revision 可重建</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="900" y="166" width="250" height="202" rx="8" fill="#fff8f6" stroke="#efd8d2"/>
    <rect x="900" y="166" width="250" height="7" rx="3" fill="#c84f3d"/>
    <text x="924" y="207" class="tag" fill="#c84f3d">TOPIC</text><text x="924" y="241" class="h">跨时间主题派生层</text>
    <text x="924" y="276" class="p">摘要 · 独立事实原子</text><text x="924" y="304" class="p">人物 · 情绪 · 相关话题</text>
    <rect x="924" y="326" width="88" height="25" rx="6" fill="#fae5e0"/><text x="941" y="344" class="small" fill="#c84f3d">自动只读</text>
  </g>
  <path d="M582 267H607" class="line"/><path d="M862 267H887" class="line"/>

  <text x="620" y="425" class="tag" fill="#2f7d50">USER PROFILE DERIVATION</text>
  <g filter="url(#shadow)">
    <rect x="620" y="452" width="230" height="196" rx="8" fill="#f1faf6" stroke="#cce2d8"/>
    <text x="644" y="493" class="tag" fill="#2f7d50">PROJECTION EVENTS</text><text x="644" y="527" class="h">有序画像维护</text>
    <text x="644" y="562" class="p">稳定私聊 actor</text><text x="644" y="590" class="p">事实与关系独立检查点</text>
    <text x="644" y="618" class="p">失败保留旧画像并可重试</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="900" y="416" width="250" height="134" rx="8" fill="#f4fbfa" stroke="#c8e2df"/>
    <text x="924" y="454" class="tag" fill="#187b78">OBJECTIVE PROFILE</text><text x="924" y="485" class="h">可溯源客观画像</text>
    <text x="924" y="512" class="p">active 可注入</text><text x="924" y="536" class="p">其他状态仅维护</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="900" y="580" width="250" height="154" rx="8" fill="#fff8f6" stroke="#efd8d2"/>
    <text x="924" y="614" class="tag" fill="#c84f3d">PERSONA RELATIONSHIP</text>
    <text x="924" y="645" class="h">persona 对用户的</text><text x="924" y="670" class="h">主观关系</text>
    <text x="924" y="697" class="p">六维 · 标签 · 主观叙述</text><text x="924" y="721" class="p">只保留 persona 摘要签名</text>
  </g>
  <g>
    <rect x="620" y="684" width="230" height="78" rx="8" fill="#fffaf3" stroke="#eadcc7"/>
    <text x="644" y="714" class="tag" fill="#a55f10">CURRENT PERSONA</text><text x="644" y="742" class="p">执行时读取 · 发布前再校验</text>
  </g>
  <path d="M435 380V550H607" class="line"/><path d="M862 514H887" class="line"/><path d="M862 596H876V657H887" class="line"/><path d="M862 723H878V698H887" class="dash"/>

  <g filter="url(#shadow)">
    <rect x="1200" y="166" width="200" height="596" rx="8" fill="#f7f8fa" stroke="#dce3e8"/>
    <rect x="1200" y="166" width="200" height="7" rx="3" fill="#64717d"/>
    <text x="1220" y="205" class="tag" fill="#64717d">CURRENT PRIVATE</text><text x="1220" y="222" class="tag" fill="#64717d">REQUEST</text>

    <rect x="1220" y="244" width="160" height="94" rx="7" fill="#fff8f6" stroke="#efd8d2"/>
    <text x="1236" y="271" class="tag" fill="#c84f3d">TOPIC RECALL</text>
    <text x="1236" y="300" class="h">相关 Topic</text><text x="1236" y="324" class="small">Timeline 按需召回</text>

    <text x="1295" y="369" class="h" fill="#64717d">+</text>

    <rect x="1220" y="389" width="160" height="138" rx="7" fill="#f4fbfa" stroke="#c8e2df"/>
    <text x="1236" y="416" class="tag" fill="#187b78">EXACT USER</text>
    <text x="1236" y="445" class="h">精确用户画像</text>
    <text x="1236" y="472" class="small">Bot + persona</text><text x="1236" y="494" class="small">+ 稳定用户</text><text x="1236" y="516" class="small">active 事实 + 关系</text>

    <path d="M1300 536V553" class="line"/>

    <rect x="1220" y="570" width="160" height="124" rx="7" fill="#f5f7ff" stroke="#d4dcf4"/>
    <text x="1236" y="597" class="tag" fill="#3769d6">INJECTION</text>
    <text x="1236" y="626" class="h">独立预算内</text><text x="1236" y="652" class="h">data-only 注入</text>
    <text x="1236" y="679" class="small">当前消息始终优先</text>
  </g>
  <path d="M1162 267H1187" class="dash"/>
  <path d="M1162 483H1187" class="dash"/>
  <path d="M1162 657H1187" class="dash"/>
</svg>
