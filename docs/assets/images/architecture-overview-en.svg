<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
  <title id="title">LivingMemory two-layer memory architecture</title>
  <desc id="desc">Raw conversations produce Timeline, formal fragments, and Topic with traceable provenance, actors, and revisions.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#17303a" flood-opacity="0.10"/></filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#82939d"/></marker>
    <style>
      .title{font:700 34px Inter,"Noto Sans SC",sans-serif;fill:#17212b}.sub{font:400 17px Inter,"Noto Sans SC",sans-serif;fill:#64717d}
      .h{font:700 21px Inter,"Noto Sans SC",sans-serif;fill:#17212b}.p{font:400 15px Inter,"Noto Sans SC",sans-serif;fill:#52616c}.tag{font:700 12px Inter,"Noto Sans SC",sans-serif;letter-spacing:1px}
      .small{font:500 13px Inter,"Noto Sans SC",sans-serif;fill:#64717d}.line{stroke:#82939d;stroke-width:2;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1440" height="760" fill="#ffffff"/>
  <text x="64" y="68" class="title">From continuous conversation to maintainable Topics</text>
  <text x="64" y="101" class="sub">Timeline preserves experience; Topic reorganizes themes; every derived item traces back to its source.</text>

  <g filter="url(#shadow)">
    <rect x="64" y="154" width="278" height="236" rx="8" fill="#f7f9fa" stroke="#d8e1e6"/>
    <rect x="64" y="154" width="278" height="7" rx="3" fill="#c9791c"/>
    <text x="88" y="197" class="tag" fill="#a55f10">SOURCE</text>
    <text x="88" y="235" class="h">Raw conversation</text>
    <text x="88" y="271" class="p">Messages, senders, roles, time</text>
    <text x="88" y="299" class="p">Summary cursor and source range</text>
    <text x="88" y="327" class="p">Optional source snapshots</text>
    <rect x="88" y="348" width="137" height="25" rx="6" fill="#fff1df"/><text x="102" y="366" class="small" fill="#a55f10">conversations.db</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="398" y="154" width="278" height="236" rx="8" fill="#f4fbfa" stroke="#c8e2df"/>
    <rect x="398" y="154" width="278" height="7" rx="3" fill="#187b78"/>
    <text x="422" y="197" class="tag" fill="#187b78">TIMELINE</text>
    <text x="422" y="235" class="h">Timeline source layer</text>
    <text x="422" y="271" class="p">Summary, facts, themes, affect</text>
    <text x="422" y="299" class="p">Stable memory_uid + revision</text>
    <text x="422" y="327" class="p">Actor bindings and source span</text>
    <rect x="422" y="348" width="101" height="25" rx="6" fill="#daf0ee"/><text x="438" y="366" class="small" fill="#187b78">Editable</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="732" y="154" width="278" height="236" rx="8" fill="#f5f7ff" stroke="#d4dcf4"/>
    <rect x="732" y="154" width="278" height="7" rx="3" fill="#3769d6"/>
    <text x="756" y="197" class="tag" fill="#3769d6">FORMAL FRAGMENT</text>
    <text x="756" y="235" class="h">Formal fragment</text>
    <text x="756" y="271" class="p">One future retrieval intent</text>
    <text x="756" y="299" class="p">Facts, actors, affect, and time</text>
    <text x="756" y="327" class="p">Timeline UID + revision</text>
    <rect x="756" y="348" width="158" height="25" rx="6" fill="#e5eaff"/><text x="771" y="366" class="small" fill="#3769d6">Stable derived identity</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1066" y="154" width="310" height="236" rx="8" fill="#fff8f6" stroke="#efd8d2"/>
    <rect x="1066" y="154" width="310" height="7" rx="3" fill="#c84f3d"/>
    <text x="1090" y="197" class="tag" fill="#c84f3d">TOPIC</text>
    <text x="1090" y="235" class="h">Derived Topic layer</text>
    <text x="1090" y="271" class="p">Cross-time summary and own fact atoms</text>
    <text x="1090" y="299" class="p">Actor index, affect, related Topics</text>
    <text x="1090" y="327" class="p">Atomically published snapshot</text>
    <rect x="1090" y="348" width="88" height="25" rx="6" fill="#fae5e0"/><text x="1107" y="366" class="small" fill="#c84f3d">Read-only</text>
  </g>

  <path d="M354 272 H385" class="line"/><path d="M688 272 H719" class="line"/><path d="M1022 272 H1053" class="line"/>

  <rect x="64" y="458" width="1312" height="224" rx="8" fill="#f7f8fa" stroke="#dde4e8"/>
  <text x="88" y="501" class="tag" fill="#64717d">SHARED CONTRACTS</text>
  <text x="88" y="535" class="h">Contracts across the complete chain</text>
  <g>
    <rect x="88" y="564" width="287" height="88" rx="8" fill="#fff" stroke="#dce3e8"/>
    <text x="108" y="596" class="h" font-size="17">Provenance and versions</text><text x="108" y="625" class="small">Stable UID · revision · source fact key</text>
    <rect x="395" y="564" width="287" height="88" rx="8" fill="#fff" stroke="#dce3e8"/>
    <text x="415" y="596" class="h" font-size="17">Actors and facts</text><text x="415" y="625" class="small">actor ref · fact ref · resolution state</text>
    <rect x="702" y="564" width="287" height="88" rx="8" fill="#fff" stroke="#dce3e8"/>
    <text x="722" y="596" class="h" font-size="17">Model artifacts</text><text x="722" y="625" class="small">Provider · model · dimensions · input version</text>
    <rect x="1009" y="564" width="343" height="88" rx="8" fill="#fff" stroke="#dce3e8"/>
    <text x="1029" y="596" class="h" font-size="17">Safe publication</text><text x="1029" y="625" class="small">Checkpoints · validation · atomic switch · rollback</text>
  </g>
</svg>
