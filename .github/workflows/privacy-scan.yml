name: Privacy scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  privacy-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan tracked files and history
        run: python scripts/privacy_scan.py --history
