name: Auto Release on Version Update

on:
  push:
    branches:
      - main
      - master
    paths:
      - metadata.yaml
      - package.json
      - main.py
      - core/managers/backup_manager.py
      - CHANGELOG.md
      - scripts/prepare_release_notes.py
      - .github/workflows/auto-release.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version_changed: ${{ steps.check.outputs.changed }}
      new_version: ${{ steps.check.outputs.version }}
      old_version: ${{ steps.check.outputs.old_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # workflow_dispatch must see every existing release tag before it
          # decides whether the current version still needs publishing.
          fetch-depth: 0

      - name: Validate release metadata
        run: |
          python scripts/prepare_release_notes.py \
            --repository "${GITHUB_REPOSITORY}" \
            --previous-version none \
            --output /tmp/release-notes-preview.md

      - name: Check version change
        id: check
        shell: bash
        run: |
          set -euo pipefail
          current_version=$(awk '/^version:/ {print $2; exit}' metadata.yaml)
          previous_version=none
          if git cat-file -e HEAD^:metadata.yaml 2>/dev/null; then
            previous_version=$(git show HEAD^:metadata.yaml | awk '/^version:/ {print $2; exit}')
          fi

          changed=false
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            if ! git rev-parse -q --verify "refs/tags/v${current_version}" >/dev/null; then
              changed=true
            fi
          elif [[ "${current_version}" != "${previous_version}" ]]; then
            changed=true
          fi

          echo "changed=${changed}" >> "${GITHUB_OUTPUT}"
          echo "version=${current_version}" >> "${GITHUB_OUTPUT}"
          echo "old_version=${previous_version}" >> "${GITHUB_OUTPUT}"
          echo "Version: ${previous_version} -> ${current_version}; release=${changed}"

  create-release:
    needs: check-version
    if: needs.check-version.outputs.version_changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release tag is new
        shell: bash
        run: |
          set -euo pipefail
          tag="v${{ needs.check-version.outputs.new_version }}"
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "Tag ${tag} already exists; refusing to overwrite a release." >&2
            exit 1
          fi

      - name: Generate release notes from CHANGELOG
        run: |
          python scripts/prepare_release_notes.py \
            --repository "${GITHUB_REPOSITORY}" \
            --previous-version "${{ needs.check-version.outputs.old_version }}" \
            --output release-notes.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check-version.outputs.new_version }}
          name: LivingMemory v${{ needs.check-version.outputs.new_version }}
          body_path: release-notes.md
          draft: false
          prerelease: false
          generate_release_notes: false
